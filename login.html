<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="narrow">
    <h1>굿즈샵</h1>

    <div class="card">
      <h2>로그인</h2>
      <form id="login-form">
        <div class="field">
          <label for="login-email">이메일</label>
          <input id="login-email" type="email" required />
        </div>
        <div class="field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" required />
        </div>
        <button class="btn block" type="submit">로그인</button>
        <p class="error-text" id="login-error" hidden></p>
      </form>
    </div>

    <div class="card">
      <h2>회원가입</h2>
      <form id="signup-form">
        <div class="field">
          <label for="signup-email">이메일</label>
          <input id="signup-email" type="email" required />
        </div>
        <div class="field">
          <label for="signup-password">비밀번호</label>
          <input id="signup-password" type="password" minlength="6" required />
        </div>
        <button class="btn secondary block" type="submit">회원가입</button>
        <p class="error-text" id="signup-error" hidden></p>
        <p class="notice-text" id="signup-notice" hidden></p>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
