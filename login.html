<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>로그인 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0071e3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <div class="auth-screen">
    <div class="narrow">
      <h1 class="auth-title">굿즈샵</h1>
      <p class="auth-sub">로그인하고 쇼핑을 시작하세요.</p>

      <div class="card">
        <form id="auth-form">
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" required />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" minlength="6" required />
          </div>
          <div class="btn-row">
            <button class="btn" type="submit">로그인</button>
            <button class="btn secondary" type="button" id="signup-btn">회원가입</button>
          </div>
          <p class="error-text" id="auth-error" hidden></p>
          <p class="notice-text" id="auth-notice" hidden></p>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
